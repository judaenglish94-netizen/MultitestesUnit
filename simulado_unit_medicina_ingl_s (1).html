    function showExamSelectionMenu() {
      currentExamKey = null;
      userAnswers = {};
      checkedQuestions = {};
      
      document.getElementById('top-nav-bar').classList.add('hidden');

      const appContent = document.getElementById('app-content');
      appContent.innerHTML = `
        <div class="text-center py-3 space-y-4">
          <div class="inline-block bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider border border-red-200">
            Simulador Oficial UNIT Medicina
          </div>
          <h1 class="text-xl sm:text-2xl font-black text-slate-800 tracking-tight">
            Selecione a Prova de Inglês
          </h1>
          <p class="text-xs sm:text-sm text-slate-600 max-w-md mx-auto leading-relaxed">
            Pratique com as questões reais de Língua Estrangeira do vestibular de Medicina da Universidade Tiradentes.
          </p>

          <div class="grid grid-cols-1 gap-3 pt-2 max-w-md mx-auto">
            
            <!-- Botão Prova 2026.2 -->
            <button onclick="startExam('2026.2')" class="bg-white border-2 border-red-500 hover:border-red-700 hover:bg-red-50/50 p-3.5 rounded-xl text-left shadow-md transition-all group flex flex-col justify-between">
              <div>
                <span class="bg-red-600 text-white text-[10px] font-extrabold px-2 py-0.5 rounded uppercase">Edição Mais Recente</span>
                <h2 class="text-sm font-bold text-slate-800 group-hover:text-red-700 mt-1">
                  Processo Seletivo Medicina 2026.2
                </h2>
                <p class="text-xs text-slate-500 mt-0.5">Provas: 31/05/2026 • 4 Questões com Imagem</p>
              </div>
              <div class="mt-2 flex items-center text-xs font-bold text-red-600 group-hover:translate-x-1 transition-transform">
                Iniciar Simulado 2026.2 →
              </div>
            </button>

            <!-- Botão Prova 2026.1 -->
            <button onclick="startExam('2026.1')" class="bg-white border-2 border-red-400 hover:border-red-600 hover:bg-red-50/50 p-3.5 rounded-xl text-left shadow-md transition-all group flex flex-col justify-between">
              <div>
                <span class="bg-slate-800 text-white text-[10px] font-extrabold px-2 py-0.5 rounded uppercase">Edição Intermediária</span>
                <h2 class="text-sm font-bold text-slate-800 group-hover:text-red-700 mt-1">
                  Processo Seletivo Medicina 2026.1
                </h2>
                <p class="text-xs text-slate-500 mt-0.5">Provas: 26/10/2025 • 4 Questões com Imagem</p>
              </div>
              <div class="mt-2 flex items-center text-xs font-bold text-red-600 group-hover:translate-x-1 transition-transform">
                Iniciar Simulado 2026.1 →
              </div>
            </button>

            <!-- Botão Prova 2025.2 -->
            <button onclick="startExam('2025.2')" class="bg-white border-2 border-slate-300 hover:border-red-600 hover:bg-red-50/50 p-3.5 rounded-xl text-left shadow-md transition-all group flex flex-col justify-between">
              <div>
                <span class="bg-slate-600 text-white text-[10px] font-extrabold px-2 py-0.5 rounded uppercase">Edição Anterior</span>
                <h2 class="text-sm font-bold text-slate-800 group-hover:text-red-700 mt-1">
                  Vestibular Medicina 2025.2
                </h2>
                <p class="text-xs text-slate-500 mt-0.5">Provas: 01/06/2025 • 4 Questões com Imagem</p>
              </div>
              <div class="mt-2 flex items-center text-xs font-bold text-red-600 group-hover:translate-x-1 transition-transform">
                Iniciar Simulado 2025.2 →
              </div>
            </button>

          </div>
        </div>
      `;
    }

    // Inicia a Resolução da Prova
    function startExam(examKey) {
      currentExamKey = examKey;
      currentQuestionIndex = 0;
      userAnswers = {};
      checkedQuestions = {};

      document.getElementById('top-nav-bar').classList.remove('hidden');
      renderQuestionMenu();
      renderCurrentQuestion();
    }

    // Volta ao Menu Inicial
    function goToMenu() {
      showExamSelectionMenu();
    }

    // Renderiza a Barra Superior Numérica
    function renderQuestionMenu() {
      const exam = examsData[currentExamKey];
      const navMenu = document.getElementById('question-nav-menu');
      navMenu.innerHTML = '';

      exam.questions.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.textContent = idx + 1;
        
        let btnClasses = "w-7 h-7 sm:w-8 sm:h-8 rounded-lg text-xs font-extrabold transition flex items-center justify-center border shadow-sm ";
        
        if (idx === currentQuestionIndex) {
          btnClasses += "bg-red-600 text-white border-red-700 ring-2 ring-red-400 scale-105 ";
        } else if (checkedQuestions[idx]) {
          const isCorrect = userAnswers[idx] === q.correctIndex;
          if (isCorrect) {
            btnClasses += "bg-emerald-600 text-white border-emerald-700 ";
          } else {
            btnClasses += "bg-red-100 text-red-700 border-red-300 ";
          }
        } else if (userAnswers[idx] !== undefined) {
          btnClasses += "bg-blue-100 text-blue-800 border-blue-400 ";
        } else {
          btnClasses += "bg-white text-slate-700 border-slate-300 hover:bg-slate-100 ";
        }

        btn.className = btnClasses;
        btn.onclick = () => {
          currentQuestionIndex = idx;
          renderQuestionMenu();
          renderCurrentQuestion();
        };
        navMenu.appendChild(btn);
      });
    }

    // Renderiza a Questão Atual com suporte a Imagem de Apoio
    function renderCurrentQuestion() {
      const exam = examsData[currentExamKey];
      const q = exam.questions[currentQuestionIndex];
      const isChecked = checkedQuestions[currentQuestionIndex] || false;
      const selectedOption = userAnswers[currentQuestionIndex];

      const appContent = document.getElementById('app-content');
      
      let html = `
        <div class="space-y-4">
          <!-- Identificação Oficial da Questão -->
          <div class="flex items-center justify-between border-b pb-2">
            <div>
              <span class="text-[11px] font-black uppercase text-red-600 tracking-wider">${exam.title}</span>
              <h2 class="text-base font-black text-slate-800">${q.officialNumber} (Questão ${currentQuestionIndex + 1} de ${exam.questions.length})</h2>
            </div>
            <span class="text-xs font-bold bg-slate-100 text-slate-700 px-2.5 py-1 rounded-md border border-slate-200">Inglês</span>
          </div>

          <!-- Moldura Personalizada para Imagem (Quando Existir) -->
          ${q.imageUrl ? `
            <div class="w-full flex flex-col items-center justify-center my-2 bg-slate-50 p-2.5 rounded-xl border-2 border-slate-200 shadow-sm">
              <img 
                src="${q.imageUrl}" 
                alt="Imagem de apoio da ${q.officialNumber}" 
                class="max-h-64 sm:max-h-72 object-contain rounded-lg border border-slate-300 bg-white p-1"
                onerror="this.onerror=null; this.parentNode.innerHTML='<div class=\\'text-xs text-slate-500 italic p-3 text-center bg-slate-100 rounded-lg border border-slate-300 w-full\\'>📷 [Imagem de Apoio da Questão: Certifique-se de que o arquivo \\'${q.imageUrl}\\' está na pasta do seu GitHub]</div>';"
              />
              <span class="text-[10px] text-slate-500 font-medium mt-1">Figura referente à ${q.officialNumber}</span>
            </div>
          ` : ''}

          <!-- Texto de Contextualização -->
          ${q.context ? `
            <div class="bg-slate-50 border-l-4 border-red-600 p-3 rounded text-xs sm:text-sm text-slate-700 font-serif leading-relaxed whitespace-pre-line shadow-inner">
              ${q.context}
            </div>
          ` : ''}

          <!-- Enunciado -->
          <p class="text-xs sm:text-sm font-bold text-slate-900 whitespace-pre-line leading-snug">
            ${q.prompt}
          </p>

          <!-- Lista de Opções -->
          <div class="space-y-2 pt-1">
      `;

      const optionLabels = ['A', 'B', 'C', 'D', 'E'];

      q.options.forEach((optText, optIdx) => {
        let labelColor = "bg-slate-200 text-slate-700";
        let cardStyle = "border-slate-200 hover:border-red-400 bg-white hover:bg-red-50/20";

        if (selectedOption === optIdx) {
          labelColor = "bg-red-600 text-white";
          cardStyle = "border-red-600 bg-red-50/60 ring-1 ring-red-500";
        }

        if (isChecked) {
          if (optIdx === q.correctIndex) {
            labelColor = "bg-emerald-600 text-white";
            cardStyle = "border-emerald-600 bg-emerald-50 ring-2 ring-emerald-500 font-medium";
          } else if (selectedOption === optIdx && optIdx !== q.correctIndex) {
            labelColor = "bg-red-600 text-white";
            cardStyle = "border-red-500 bg-red-100/80";
          } else {
            cardStyle = "border-slate-200 opacity-50 bg-white";
          }
        }

        html += `
          <button 
            onclick="selectOption(${optIdx})" 
            ${isChecked ? 'disabled' : ''} 
            class="w-full text-left p-3 rounded-lg border-2 transition flex items-start gap-3 shadow-sm ${cardStyle}">
            <span class="w-6 h-6 rounded-md font-bold text-xs flex items-center justify-center shrink-0 ${labelColor}">
              ${optionLabels[optIdx]}
            </span>
            <span class="text-xs sm:text-sm text-slate-800 pt-0.5 leading-snug">
              ${optText}
            </span>
          </button>
        `;
      });

      html += `</div>`;

      // Feedback / Justificativa em Português
      if (isChecked) {
        const isCorrect = selectedOption === q.correctIndex;
        html += `
          <div class="mt-4 p-4 rounded-xl border-2 ${isCorrect ? 'bg-emerald-50 border-emerald-500 text-emerald-950' : 'bg-red-50 border-red-500 text-red-950'} shadow-md">
            <div class="flex items-center gap-2 mb-1.5">
              <span class="text-lg">${isCorrect ? '✅' : '❌'}</span>
              <h3 class="font-extrabold text-sm uppercase tracking-wide">
                ${isCorrect ? 'Gabarito Correto!' : 'Gabarito Incorreto!'}
              </h3>
            </div>
            <div class="text-xs sm:text-sm leading-relaxed border-t border-slate-200/80 pt-2">
              ${q.explanation}
            </div>
          </div>
        `;
      }

      // Barra de Controle Inferior: PREVIOUS | CHECK | NEXT/FINISH
      html += `
        <div class="flex items-center justify-between gap-2 pt-4 border-t mt-4">
          <!-- Botão PREVIOUS -->
          <button 
            onclick="prevQuestion()" 
            ${currentQuestionIndex === 0 ? 'disabled' : ''} 
            class="bg-red-600 hover:bg-red-700 disabled:opacity-40 disabled:hover:bg-red-600 text-white font-bold py-2 px-3 sm:px-4 rounded-lg text-xs sm:text-sm transition shadow flex items-center gap-1">
            ◄ Previous
          </button>

          <!-- Botão CHECK -->
          <button 
            onclick="checkAnswer()" 
            ${selectedOption === undefined || isChecked ? 'disabled' : ''} 
            class="bg-red-600 hover:bg-red-700 disabled:opacity-40 disabled:hover:bg-red-600 text-white font-black py-2 px-4 sm:px-6 rounded-lg text-xs sm:text-sm transition shadow-lg ring-2 ring-red-300 uppercase">
            CHECK
          </button>

          <!-- Botão NEXT / FINISH -->
          ${currentQuestionIndex < exam.questions.length - 1 ? `
            <button 
              onclick="nextQuestion()" 
              class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-3 sm:px-4 rounded-lg text-xs sm:text-sm transition shadow flex items-center gap-1">
              Next ►
            </button>
          ` : `
            <button 
              onclick="showResultsSummary()" 
              class="bg-emerald-600 hover:bg-emerald-700 text-white font-black py-2 px-3 sm:px-4 rounded-lg text-xs sm:text-sm transition shadow uppercase">
              FINISH
            </button>
          `}
        </div>
      `;

      appContent.innerHTML = html;
    }

    // Seleção de opção
    function selectOption(optIdx) {
      if (checkedQuestions[currentQuestionIndex]) return;
      userAnswers[currentQuestionIndex] = optIdx;
      renderQuestionMenu();
      renderCurrentQuestion();
    }

    // Confirmação de resposta com botão CHECK
    function checkAnswer() {
      if (userAnswers[currentQuestionIndex] === undefined) return;
      checkedQuestions[currentQuestionIndex] = true;
      renderQuestionMenu();
      renderCurrentQuestion();
    }

    // Questão Anterior
    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuestionMenu();
        renderCurrentQuestion();
      }
    }

    // Próxima Questão
    function nextQuestion() {
      const exam = examsData[currentExamKey];
      if (currentQuestionIndex < exam.questions.length - 1) {
        currentQuestionIndex++;
        renderQuestionMenu();
        renderCurrentQuestion();
      }
    }

    // Relatório de Desempenho no encerramento
    function showResultsSummary() {
      const exam = examsData[currentExamKey];
      let correctCount = 0;

      exam.questions.forEach((q, idx) => {
        if (userAnswers[idx] === q.correctIndex) {
          correctCount++;
        }
      });

      const totalQuestions = exam.questions.length;
      const incorrectCount = totalQuestions - correctCount;
      const percentageAccurate = ((correctCount / totalQuestions) * 100).toFixed(1);
      const scoreOutofTen = ((correctCount / totalQuestions) * 10).toFixed(1);

      const appContent = document.getElementById('app-content');
      
      let summaryHtml = `
        <div class="space-y-5 text-center py-2">
          <div class="bg-red-50 border-2 border-red-500 rounded-xl p-4 shadow-sm">
            <span class="text-xs font-black uppercase text-red-600 tracking-wider">${exam.institution}</span>
            <h2 class="text-base sm:text-lg font-black text-slate-800 mt-0.5">${exam.title}</h2>
            <p class="text-xs text-slate-500">${exam.date}</p>
          </div>

          <!-- Placar da Nota Final -->
          <div class="bg-slate-900 text-white rounded-2xl p-5 shadow-xl border-4 border-red-600 flex flex-col items-center justify-center">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Sua Pontuação em Inglês</span>
            <div class="text-4xl sm:text-5xl font-black text-red-500 my-1">${scoreOutofTen} <span class="text-lg text-slate-400 font-normal">/ 10.0</span></div>
            <p class="text-xs text-slate-300 font-medium">Aproveitamento Global: <strong class="text-white">${percentageAccurate}%</strong></p>
          </div>

          <!-- Resumo em Blocos -->
          <div class="grid grid-cols-2 gap-3 max-w-md mx-auto">
            <div class="bg-emerald-50 border-2 border-emerald-500 p-3 rounded-xl">
              <span class="text-2xl font-black text-emerald-700">${correctCount}</span>
              <p class="text-xs font-bold text-emerald-800 uppercase mt-0.5">Acertos (${((correctCount/totalQuestions)*100).toFixed(0)}%)</p>
            </div>
            <div class="bg-red-50 border-2 border-red-400 p-3 rounded-xl">
              <span class="text-2xl font-black text-red-700">${incorrectCount}</span>
              <p class="text-xs font-bold text-red-800 uppercase mt-0.5">Erros (${((incorrectCount/totalQuestions)*100).toFixed(0)}%)</p>
            </div>
          </div>

          <!-- Revisão Questão a Questão -->
          <div class="text-left border-t pt-4 space-y-2.5">
            <h3 class="font-extrabold text-xs sm:text-sm text-slate-800 uppercase border-b pb-1">Resumo do Gabarito</h3>
      `;

      exam.questions.forEach((q, idx) => {
        const userChoice = userAnswers[idx];
        const isCorrect = userChoice === q.correctIndex;
        const optionLabels = ['A', 'B', 'C', 'D', 'E'];

        summaryHtml += `
          <div class="p-3 rounded-lg border text-xs sm:text-sm ${isCorrect ? 'bg-emerald-50/70 border-emerald-300' : 'bg-red-50/70 border-red-300'}">
            <div class="flex items-center justify-between font-bold mb-0.5">
              <span>${q.officialNumber} (Questão ${idx + 1})</span>
              <span class="${isCorrect ? 'text-emerald-700' : 'text-red-700'}">
                ${isCorrect ? '✅ Correta' : '❌ Incorreta'}
              </span>
            </div>
            <p class="text-slate-600 text-xs">
              Sua escolha: <strong>${userChoice !== undefined ? optionLabels[userChoice] : 'Não marcada'}</strong> | Gabarito Oficial: <strong class="text-emerald-700">${optionLabels[q.correctIndex]}</strong>
            </p>
          </div>
        `;
      });

      summaryHtml += `
          </div>

          <!-- Botões Finais de Navegação -->
          <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-4 border-t">
            <button onclick="startExam('${currentExamKey}')" class="w-full sm:w-auto bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-6 rounded-lg text-xs sm:text-sm transition shadow">
              🔄 Refazer Prova
            </button>
            <button onclick="goToMenu()" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 px-6 rounded-lg text-xs sm:text-sm transition shadow">
              🏠 Menu Principal
            </button>
          </div>
        </div>
      `;

      appContent.innerHTML = summaryHtml;
    }
  </script>
</body>
</html>
