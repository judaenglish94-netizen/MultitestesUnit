            explanation: "A alternativa correta é a <strong>C</strong>.<br><br><strong>Justificativa:</strong> O parágrafo explica que a música auxilia no tratamento de ansiedade e depressão porque estimula a liberação de substâncias químicas no cérebro: <em>'music can stimulate the release of endorphins and dopamine'</em> (a música pode estimular a **liberação de endorfinas e dopamina**, que são neurotransmissores moduladores do humor e da dor).<br><br><strong>Tradução e análise das alternativas:</strong><br>• <strong>A:</strong> <em>'increasing blood pressure...'</em> (aumentando a pressão arterial) — <strong>Incorreto.</strong> O texto diz que ela reduz (lower) a pressão.<br>• <strong>B:</strong> <em>'altering the genetic structure'</em> (alterando a estrutura genética dos neurônios) — <strong>Incorreto.</strong> Sem embasamento no texto.<br>• <strong>C:</strong> <em>'stimulating the release of neurotransmitters, which regulate mood and emotions'</em> (estimulando a liberação de neurotransmissores, que regulam o humor e as emoções) — <strong>CORRETO.</strong><br>• <strong>D:</strong> <em>'completely eliminating negative emotions'</em> (eliminando completamente emoções negativas) — <strong>Incorreto.</strong> Exagero irreal.<br>• <strong>E:</strong> <em>'suppressing activity in the prefrontal cortex'</em> (suprimindo atividade no córtex pré-frontal) — <strong>Incorreto.</strong>"
          },
          {
            id: 3,
            officialNumber: "QUESTÃO 11",
            context: `Music also plays a crucial role in cognitive function. Studies have shown that listening to or playing music can enhance memory, concentration, and problem-solving skills. This is particularly beneficial for individuals with neurodegenerative conditions such as Alzheimer's disease, as familiar songs can trigger memories and improve mood.`,
            prompt: "Studies suggest that music can enhance cognitive function in patients with Alzheimer's disease.\nThe alternative that provides the most scientifically supported explanation for this phenomenon is that",
            options: [
              "music stimulates the amygdala, permanently restoring lost memories.",
              "patients with Alzheimer's disease develop new neural connections solely through passive listening.",
              "exposure to classical music increases brain mass, reversing the effects of neurodegeneration.",
              "musical engagement prevents the loss of neurons by increasing the production of gray matter in the brain.",
              "the rhythmic and melodic structures of music can activate neural pathways associated with memory even in late stages of dementia."
            ],
            correctIndex: 4,
            explanation: "A alternativa correta é a <strong>E</strong>.<br><br><strong>Justificativa:</strong> O texto explicita que a música é benéfica para pacientes de Alzheimer porque <em>'familiar songs can trigger memories and improve mood'</em> (canções familiares podem **ativar memórias e melhorar o humor**). A explicação científica respaldada é que estruturas rítmicas e melódicas ativam vias neurais associadas à memória mesmo em estágios avançados da demência.<br><br><strong>Análise das opções:</strong><br>• <strong>A:</strong> <em>'permanently restoring lost memories'</em> (restaurando permanentemente memórias perdidas) — <strong>Incorreto.</strong> Não há cura ou restauração permanente mencionada.<br>• <strong>B:</strong> <em>'solely through passive listening'</em> (exclusivamente por escuta passiva) — <strong>Incorreto.</strong> O texto menciona 'listening to or playing'.<br>• <strong>C:</strong> <em>'increases brain mass, reversing...'</em> (aumenta a massa cerebral, revertendo a neurodegeneração) — <strong>Incorreto.</strong> Afirmação falsa.<br>• <strong>D:</strong> <em>'prevents loss of neurons by increasing gray matter'</em> — <strong>Incorreto.</strong><br>• <strong>E:</strong> <em>'the rhythmic and melodic structures of music can activate neural pathways associated with memory even in late stages of dementia'</em> — <strong>CORRETO.</strong>"
          },
          {
            id: 4,
            officialNumber: "QUESTÃO 12",
            context: `...music therapy is often used in hospitals and mental health treatment to help patients manage pain, anxiety, and depression as music can stimulate the release of endorphins and dopamine, which are natural painkillers.`,
            prompt: "In medical settings, music therapy has been used as an alternative method for pain management.\nThe primary way in which music is believed to reduce the perception of pain is that it",
            options: [
              "blocks pain receptors in the nervous system by directly interfering with nociceptors.",
              "accelerates the healing process by altering the body's cellular regeneration rate.",
              "distracts the patient from pain, allowing them to ignore its presence completely.",
              "numbs the nervous system, preventing the transmission of pain signals to the brain.",
              "increases the production of hormones that activate the brain's reward system, creating a natural analgesic effect."
            ],
            correctIndex: 4,
            explanation: "A alternativa correta é a <strong>E</strong>.<br><br><strong>Justificativa:</strong> O texto aponta expressamente que a música reduz a percepção de dor pois <em>'stimulate the release of endorphins and dopamine, which are natural painkillers'</em> (estimula a liberação de endorfinas e dopamina, que funcionam como **analgésicos naturais** do próprio corpo, ativando o sistema de recompensa e bem-estar).<br><br><strong>Tradução e análise das opções:</strong><br>• <strong>A:</strong> <em>'blocks pain receptors...'</em> (bloqueia receptores de dor diretamente) — <strong>Incorreto.</strong><br>• <strong>B:</strong> <em>'accelerates the healing process...'</em> (acelera a regeneração celular) — <strong>Incorreto.</strong><br>• <strong>C:</strong> <em>'ignore its presence completely'</em> (ignorar a dor completamente) — <strong>Incorreto.</strong><br>• <strong>D:</strong> <em>'numbs the nervous system'</em> (anestesia o sistema nervoso) — <strong>Incorreto.</strong><br>• <strong>E:</strong> <em>'increases the production of hormones that activate the brain's reward system, creating a natural analgesic effect'</em> (aumenta a produção de hormônios que ativam o sistema de recompensa do cérebro, criando um efeito analgésico natural) — <strong>CORRETO.</strong>"
          }
        ]
      }
    };

    // Estado Global da Aplicação
    let currentExamKey = null;
    let currentQuestionIndex = 0;
    let userAnswers = {}; // Armazena escolhas do utilizador
    let checkedQuestions = {}; // Guarda se a questão já foi verificada

    // Iniciar a aplicação exibindo a seleção de exames
    window.onload = () => {
      showExamSelectionMenu();
    };

    // Exibe o Menu Principal de Seleção de Prova
    function showExamSelectionMenu() {
      currentExamKey = null;
      userAnswers = {};
      checkedQuestions = {};
      
      const topBar = document.getElementById('top-nav-bar');
      topBar.classList.add('hidden');

      const appContent = document.getElementById('app-content');
      appContent.innerHTML = `
        <div class="text-center py-4 space-y-4">
          <div class="inline-block bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-2 border border-red-300">
            Simulador de Inglês Medicina
          </div>
          <h1 class="text-xl sm:text-2xl font-black text-slate-800 tracking-tight">
            Selecione a Prova UNIT para Praticar
          </h1>
          <p class="text-xs sm:text-sm text-slate-600 max-w-lg mx-auto">
            Resolva as questões oficiais de Língua Estrangeira (Inglês) extraídas dos exames anteriores da Universidade Tiradentes. Receba feedback com justificativas explicativas em português.
          </p>

          <div class="grid grid-cols-1 gap-3 pt-3 max-w-md mx-auto">
            
            <!-- Card Prova 2026.2 -->
            <button onclick="startExam('2026.2')" class="bg-white border-2 border-red-500 hover:border-red-700 hover:bg-red-50 p-3.5 rounded-xl text-left shadow-md transition-all group flex flex-col justify-between">
              <div>
                <span class="bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">Edição Mais Recente</span>
                <h2 class="text-sm font-bold text-slate-800 group-hover:text-red-700 mt-1">
                  Processo Seletivo Medicina 2026.2
                </h2>
                <p class="text-xs text-slate-500 mt-0.5">Aplicação: 31/05/2026 • 4 Questões Objetivas</p>
              </div>
              <div class="mt-2 flex items-center text-xs font-bold text-red-600 group-hover:translate-x-1 transition-transform">
                Iniciar Prova 2026.2 →
              </div>
            </button>

            <!-- Card Prova 2026.1 -->
            <button onclick="startExam('2026.1')" class="bg-white border-2 border-red-400 hover:border-red-600 hover:bg-red-50 p-3.5 rounded-xl text-left shadow-md transition-all group flex flex-col justify-between">
              <div>
                <span class="bg-slate-800 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">Edição Intermediária</span>
                <h2 class="text-sm font-bold text-slate-800 group-hover:text-red-700 mt-1">
                  Processo Seletivo Medicina 2026.1
                </h2>
                <p class="text-xs text-slate-500 mt-0.5">Aplicação: 26/10/2025 • 4 Questões Objetivas</p>
              </div>
              <div class="mt-2 flex items-center text-xs font-bold text-red-600 group-hover:translate-x-1 transition-transform">
                Iniciar Prova 2026.1 →
              </div>
            </button>

            <!-- Card Prova 2025.2 -->
            <button onclick="startExam('2025.2')" class="bg-white border-2 border-slate-300 hover:border-red-600 hover:bg-red-50 p-3.5 rounded-xl text-left shadow-md transition-all group flex flex-col justify-between">
              <div>
                <span class="bg-slate-600 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">Edição Anterior</span>
                <h2 class="text-sm font-bold text-slate-800 group-hover:text-red-700 mt-1">
                  Vestibular Medicina 2025.2
                </h2>
                <p class="text-xs text-slate-500 mt-0.5">Aplicação: 01/06/2025 • 4 Questões Objetivas</p>
              </div>
              <div class="mt-2 flex items-center text-xs font-bold text-red-600 group-hover:translate-x-1 transition-transform">
                Iniciar Prova 2025.2 →
              </div>
            </button>

          </div>
        </div>
      `;
    }

    // Inicia a Prova Selecionada
    function startExam(examKey) {
      currentExamKey = examKey;
      currentQuestionIndex = 0;
      userAnswers = {};
      checkedQuestions = {};

      document.getElementById('top-nav-bar').classList.remove('hidden');
      renderQuestionMenu();
      renderCurrentQuestion();
    }

    // Retorna ao Menu Principal
    function goToMenu() {
      showExamSelectionMenu();
    }

    // Renderiza o Menu de Números das Questões na Barra Superior
    function renderQuestionMenu() {
      const exam = examsData[currentExamKey];
      const navMenu = document.getElementById('question-nav-menu');
      navMenu.innerHTML = '';

      exam.questions.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.textContent = idx + 1;
        
        // Estilização base do botão numérico
        let btnClasses = "w-7 h-7 sm:w-8 sm:h-8 rounded-lg text-xs font-bold transition flex items-center justify-center border ";
        
        if (idx === currentQuestionIndex) {
          btnClasses += "bg-red-600 text-white border-red-700 ring-2 ring-red-400 ";
        } else if (checkedQuestions[idx]) {
          const isCorrect = userAnswers[idx] === q.correctIndex;
          if (isCorrect) {
            btnClasses += "bg-emerald-600 text-white border-emerald-700 ";
          } else {
            btnClasses += "bg-red-100 text-red-700 border-red-300 ";
          }
        } else if (userAnswers[idx] !== undefined) {
          btnClasses += "bg-blue-100 text-blue-800 border-blue-300 ";
        } else {
          btnClasses += "bg-white text-slate-700 border-slate-300 hover:bg-slate-200 ";
        }

        btn.className = btnClasses;
        btn.onclick = () => {
          currentQuestionIndex = idx;
          renderQuestionMenu();
          renderCurrentQuestion();
        };
        navMenu.appendChild(btn);
      });
    }

    // Renderiza a Questão Atual
    function renderCurrentQuestion() {
      const exam = examsData[currentExamKey];
      const q = exam.questions[currentQuestionIndex];
      const isChecked = checkedQuestions[currentQuestionIndex] || false;
      const selectedOption = userAnswers[currentQuestionIndex];

      const appContent = document.getElementById('app-content');
      
      let html = `
        <div class="space-y-4">
          <!-- Cabeçalho da Questão -->
          <div class="flex items-center justify-between border-b pb-2">
            <div>
              <span class="text-[11px] font-extrabold uppercase text-red-600 tracking-wider">${exam.title}</span>
              <h2 class="text-base font-black text-slate-800">${q.officialNumber} (Questão ${currentQuestionIndex + 1} de ${exam.questions.length})</h2>
            </div>
            <span class="text-xs font-semibold bg-slate-100 text-slate-600 px-2 py-1 rounded">Inglês</span>
          </div>

          <!-- Imagem da Questão (se existir) -->
          ${q.imageUrl ? `
            <div class="my-3 flex flex-col items-center justify-center bg-slate-50 border-2 border-slate-200 rounded-xl p-2 shadow-inner">
              <img src="${q.imageUrl}" alt="Elemento Visual da ${q.officialNumber}" class="max-h-64 sm:max-h-72 w-auto object-contain rounded-lg border border-slate-300 shadow-sm" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'text-xs text-slate-400 p-2 text-center italic\'>Imagem não encontrada (${q.imageUrl}). Certifique-se de ter enviado o arquivo .png para a pasta /images no GitHub.</div>';">
              <span class="text-[10px] text-slate-400 mt-1 font-sans">Figura original do caderno de provas</span>
            </div>
          ` : ''}

          <!-- Texto de Contexto / Suporte -->
          ${q.context ? `
            <div class="bg-slate-50 border-l-4 border-red-600 p-3 rounded text-xs sm:text-sm text-slate-700 font-serif leading-relaxed whitespace-pre-line shadow-inner">
              ${q.context}
            </div>
          ` : ''}

          <!-- Enunciado / Prompt -->
          <p class="text-xs sm:text-sm font-bold text-slate-800 whitespace-pre-line">
            ${q.prompt}
          </p>

          <!-- Lista de Opções de Resposta -->
          <div class="space-y-2 pt-1">
      `;

      const optionLabels = ['A', 'B', 'C', 'D', 'E'];

      q.options.forEach((optText, optIdx) => {
        let labelColor = "bg-slate-200 text-slate-700";
        let cardStyle = "border-slate-200 hover:border-red-400 bg-white hover:bg-red-50/30";

        if (selectedOption === optIdx) {
          labelColor = "bg-red-600 text-white";
          cardStyle = "border-red-600 bg-red-50/50 ring-1 ring-red-500";
        }

        if (isChecked) {
          if (optIdx === q.correctIndex) {
            labelColor = "bg-emerald-600 text-white";
            cardStyle = "border-emerald-600 bg-emerald-50 ring-2 ring-emerald-500 font-medium";
          } else if (selectedOption === optIdx && optIdx !== q.correctIndex) {
            labelColor = "bg-red-600 text-white";
            cardStyle = "border-red-500 bg-red-100/70";
          } else {
            cardStyle = "border-slate-200 opacity-60 bg-white";
          }
        }

        html += `
          <button 
            onclick="selectOption(${optIdx})" 
            ${isChecked ? 'disabled' : ''} 
            class="w-full text-left p-3 rounded-lg border-2 transition flex items-start gap-3 shadow-sm ${cardStyle}">
            <span class="w-6 h-6 rounded-md font-bold text-xs flex items-center justify-center shrink-0 ${labelColor}">
              ${optionLabels[optIdx]}
            </span>
            <span class="text-xs sm:text-sm text-slate-800 pt-0.5 leading-snug">
              ${optText}
            </span>
          </button>
        `;
      });

      html += `</div>`;

      // Exibição do Feedback / Justificativa em Português
      if (isChecked) {
        const isCorrect = selectedOption === q.correctIndex;
        html += `
          <div class="mt-4 p-4 rounded-xl border-2 ${isCorrect ? 'bg-emerald-50 border-emerald-500 text-emerald-950' : 'bg-red-50 border-red-500 text-red-950'} shadow-md">
            <div class="flex items-center gap-2 mb-2">
              <span class="text-lg">${isCorrect ? '✅' : '❌'}</span>
              <h3 class="font-extrabold text-sm uppercase">
                ${isCorrect ? 'Resposta Correta!' : 'Resposta Incorreta!'}
              </h3>
            </div>
            <div class="text-xs sm:text-sm leading-relaxed border-t border-slate-200/60 pt-2">
              ${q.explanation}
            </div>
          </div>
        `;
      }

      // Botões de Ação na Ordem Especificada: Previous, Check, Next
      html += `
        <div class="flex items-center justify-between gap-2 pt-4 border-t mt-4">
          <!-- Botão PREVIOUS -->
          <button 
            onclick="prevQuestion()" 
            ${currentQuestionIndex === 0 ? 'disabled' : ''} 
            class="bg-red-600 hover:bg-red-700 disabled:opacity-40 disabled:hover:bg-red-600 text-white font-bold py-2 px-3 sm:px-4 rounded-lg text-xs sm:text-sm transition shadow flex items-center gap-1">
            ◄ Anterior
          </button>

          <!-- Botão CHECK -->
          <button 
            onclick="checkAnswer()" 
            ${selectedOption === undefined || isChecked ? 'disabled' : ''} 
            class="bg-red-600 hover:bg-red-700 disabled:opacity-40 disabled:hover:bg-red-600 text-white font-black py-2 px-4 sm:px-6 rounded-lg text-xs sm:text-sm transition shadow-lg ring-2 ring-red-300 uppercase">
            Verificar
          </button>

          <!-- Botão NEXT / FINISH -->
          ${currentQuestionIndex < exam.questions.length - 1 ? `
            <button 
              onclick="nextQuestion()" 
              class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-3 sm:px-4 rounded-lg text-xs sm:text-sm transition shadow flex items-center gap-1">
              Próxima ►
            </button>
          ` : `
            <button 
              onclick="showResultsSummary()" 
              class="bg-emerald-600 hover:bg-emerald-700 text-white font-black py-2 px-3 sm:px-4 rounded-lg text-xs sm:text-sm transition shadow uppercase">
              Finalizar
            </button>
          `}
        </div>
      `;

      appContent.innerHTML = html;
    }

    // Ação ao selecionar uma opção
    function selectOption(optIdx) {
      if (checkedQuestions[currentQuestionIndex]) return;
      userAnswers[currentQuestionIndex] = optIdx;
      renderQuestionMenu();
      renderCurrentQuestion();
    }

    // Ação ao clicar em Check
    function checkAnswer() {
      if (userAnswers[currentQuestionIndex] === undefined) return;
      checkedQuestions[currentQuestionIndex] = true;
      renderQuestionMenu();
      renderCurrentQuestion();
    }

    // Ir para a questão anterior
    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuestionMenu();
        renderCurrentQuestion();
      }
    }

    // Ir para a próxima questão
    function nextQuestion() {
      const exam = examsData[currentExamKey];
      if (currentQuestionIndex < exam.questions.length - 1) {
        currentQuestionIndex++;
        renderQuestionMenu();
        renderCurrentQuestion();
      }
    }

    // Apresenta o Relatório Final de Desempenho
    function showResultsSummary() {
      const exam = examsData[currentExamKey];
      let correctCount = 0;
      let answeredCount = 0;

      exam.questions.forEach((q, idx) => {
        if (userAnswers[idx] !== undefined) {
          answeredCount++;
          if (userAnswers[idx] === q.correctIndex) {
            correctCount++;
          }
        }
      });

      const totalQuestions = exam.questions.length;
      const incorrectCount = totalQuestions - correctCount;
      const percentageAccurate = ((correctCount / totalQuestions) * 100).toFixed(1);
      const scoreOutofTen = ((correctCount / totalQuestions) * 10).toFixed(1);

      const appContent = document.getElementById('app-content');
      
      let summaryHtml = `
        <div class="space-y-5 text-center py-2">
          <div class="bg-red-50 border-2 border-red-500 rounded-xl p-4 shadow-sm">
            <span class="text-xs font-extrabold uppercase text-red-600 tracking-wider">${exam.institution}</span>
            <h2 class="text-lg sm:text-xl font-black text-slate-800 mt-1">${exam.title}</h2>
            <p class="text-xs text-slate-500">${exam.date}</p>
          </div>

          <!-- Card da Nota Final -->
          <div class="bg-slate-900 text-white rounded-2xl p-5 shadow-xl border-4 border-red-600 flex flex-col items-center justify-center">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Sua Nota Final</span>
            <div class="text-4xl sm:text-5xl font-black text-red-500 my-1">${scoreOutofTen} <span class="text-lg text-slate-400 font-normal">/ 10.0</span></div>
            <p class="text-xs text-slate-300 font-medium">Aproveitamento Global: <strong class="text-white">${percentageAccurate}%</strong></p>
          </div>

          <!-- Métricas Quantitativas -->
          <div class="grid grid-cols-2 gap-3 max-w-md mx-auto">
            <div class="bg-emerald-50 border-2 border-emerald-500 p-3 rounded-xl">
              <span class="text-2xl font-black text-emerald-700">${correctCount}</span>
              <p class="text-xs font-bold text-emerald-800 uppercase mt-0.5">Acertos (${((correctCount/totalQuestions)*100).toFixed(0)}%)</p>
            </div>
            <div class="bg-red-50 border-2 border-red-400 p-3 rounded-xl">
              <span class="text-2xl font-black text-red-700">${incorrectCount}</span>
              <p class="text-xs font-bold text-red-800 uppercase mt-0.5">Erros (${((incorrectCount/totalQuestions)*100).toFixed(0)}%)</p>
            </div>
          </div>

          <!-- Detalhamento por Questão -->
          <div class="text-left border-t pt-4 space-y-3">
            <h3 class="font-extrabold text-sm text-slate-800 uppercase border-b pb-1">Revisão Detalhada das Questões</h3>
      `;

      exam.questions.forEach((q, idx) => {
        const userChoice = userAnswers[idx];
        const isCorrect = userChoice === q.correctIndex;
        const optionLabels = ['A', 'B', 'C', 'D', 'E'];

        summaryHtml += `
          <div class="p-3 rounded-lg border text-xs sm:text-sm ${isCorrect ? 'bg-emerald-50/60 border-emerald-300' : 'bg-red-50/60 border-red-300'}">
            <div class="flex items-center justify-between font-bold mb-1">
              <span>${q.officialNumber} (Questão ${idx + 1})</span>
              <span class="${isCorrect ? 'text-emerald-700' : 'text-red-700'}">
                ${isCorrect ? '✅ Correta' : '❌ Incorreta'}
              </span>
            </div>
            <p class="text-slate-600 text-xs">
              Sua resposta: <strong>${userChoice !== undefined ? optionLabels[userChoice] : 'Não respondida'}</strong> | Gabarito Oficial: <strong class="text-emerald-700">${optionLabels[q.correctIndex]}</strong>
            </p>
          </div>
        `;
      });

      summaryHtml += `
          </div>

          <!-- Botões Finais de Navegação -->
          <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-4 border-t">
            <button onclick="startExam('${currentExamKey}')" class="w-full sm:w-auto bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-6 rounded-lg text-xs sm:text-sm transition shadow">
              🔄 Refazer Esta Prova
            </button>
            <button onclick="goToMenu()" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 px-6 rounded-lg text-xs sm:text-sm transition shadow">
              🏠 Voltar ao Menu Principal
            </button>
          </div>
        </div>
      `;

      appContent.innerHTML = summaryHtml;
    }
  </script>
</body>
</html>
